CUDNN:
  BENCHMARK: true
  DETERMINISTIC: false
  ENABLED: true

GPUS: [0]
OUTPUT_DIR: 'output'
LOG_DIR: 'log'
WORKERS: 2
PRINT_FREQ: 10

DATASET:
  DATASET: TamperDatasetCLTD
  NUM_CLASSES: 2

MODEL:
  NAME: network_CAT
  NUM_CLASSES: 2
  PRETRAINED_RGB: 'pretrained_models/hrnetv2_w18_imagenet_pretrained.pth'
  PRETRAINED_DCT: 'pretrained_models/DCT_djpeg.pth.tar'
  EXTRA:
    FINAL_CONV_KERNEL: 1

    STAGE1:
      NUM_MODULES: 1
      NUM_BRANCHES: 1
      BLOCK: BOTTLENECK
      NUM_BLOCKS: [2]
      NUM_CHANNELS: [32]
      FUSE_METHOD: SUM

    STAGE2:
      NUM_MODULES: 1
      NUM_BRANCHES: 2
      BLOCK: BASIC
      NUM_BLOCKS: [2, 2]
      NUM_CHANNELS: [18, 36]
      FUSE_METHOD: SUM

    STAGE3:
      NUM_MODULES: 2
      NUM_BRANCHES: 3
      BLOCK: BASIC
      NUM_BLOCKS: [2, 2, 2]
      NUM_CHANNELS: [18, 36, 72]
      FUSE_METHOD: SUM

    STAGE4:
      NUM_MODULES: 2
      NUM_BRANCHES: 4
      BLOCK: BASIC
      NUM_BLOCKS: [2, 2, 2, 2]
      NUM_CHANNELS: [18, 36, 72, 144]
      FUSE_METHOD: SUM

    DC_STAGE3:
      NUM_MODULES: 2
      NUM_BRANCHES: 2
      BLOCK: BASIC
      NUM_BLOCKS: [2, 2]
      NUM_CHANNELS: [36, 72]
      FUSE_METHOD: SUM

    DC_STAGE4:
      NUM_MODULES: 1
      NUM_BRANCHES: 3
      BLOCK: BASIC
      NUM_BLOCKS: [2, 2, 2]
      NUM_CHANNELS: [36, 72, 144]
      FUSE_METHOD: SUM

    STAGE5:
      NUM_MODULES: 1
      NUM_BRANCHES: 4
      BLOCK: BASIC
      NUM_BLOCKS: [2, 2, 2, 2]
      NUM_CHANNELS: [12, 24, 48, 96]
      FUSE_METHOD: SUM

LOSS:
  USE_OHEM: false
  OHEMTHRES: 0.9
  OHEMKEEP: 131072

TRAIN:
  IMAGE_SIZE: [256, 256]
  BASE_SIZE: 256
  BATCH_SIZE_PER_GPU: 1
  SHUFFLE: true
  BEGIN_EPOCH: 0
  END_EPOCH: 10
  RESUME: false
  OPTIMIZER: sgd
  LR: 0.005
  WD: 0.0005
  MOMENTUM: 0.9
  NESTEROV: false
  MULTI_SCALE: false
  FLIP: false
  DOWNSAMPLERATE: 1
  IGNORE_LABEL: 255
  SCALE_FACTOR: 11

TEST:
  IMAGE_SIZE: [256, 256]
  BASE_SIZE: 256
  BATCH_SIZE_PER_GPU: 1
  NUM_SAMPLES: 0
  FLIP_TEST: false
  MULTI_SCALE: false
  MODEL_FILE: ''
